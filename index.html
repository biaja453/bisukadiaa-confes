<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bisukadiaa-confes</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1>💌 bisukadiaa-confes</h1>
    <p class="subtitle">Tulis pesanmu, kirim secara anonim.</p>

    <input type="tel" id="nomor" placeholder="Nomor WA tujuan, contoh: 6281234567890">

    <textarea id="pesan" maxlength="2000" placeholder="Tulis confession kamu di sini..."></textarea>
    <div class="counter"><span id="counter">0</span>/2000</div>

    <button id="btnKirim">Kirim</button>

    <p id="status" class="status"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
